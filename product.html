<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobiNest - Product Details</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <div class="logo">MobiNest</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main class="container">
      <div id="product-details" class="product-details">
        <!-- Product details loaded by JS -->
      </div>
    </main>

    <div style="text-align: center; margin: 2rem 0">
      <button class="btn" onclick="history.back()">← Go Back</button>
    </div>

    <footer>&copy; 2025 MobiNest. All rights reserved.</footer>

    <script>
      const products = [
        {
          id: 1,
          name: "iPhone 14 Pro",
          category: "smartphones",
          description: "Apple's latest powerhouse with an A16 Bionic chip and ProMotion display.",
          price: 999.99,
          img: "img/iphone14pro.jpg",
        },
        {
          id: 2,
          name: "Samsung Galaxy S24",
          category: "smartphones",
          description: "Experience the next-gen performance and design with Galaxy's flagship.",
          price: 899.99,
          img: "img/galaxys24.jpg",
        },
        {
          id: 3,
          name: "OnePlus 12",
          category: "smartphones",
          description: "Speed meets style in OnePlus' ultra-smooth flagship phone.",
          price: 749.99,
          img: "img/oneplus12.jpg",
        },
        {
          id: 4,
          name: "AirPods Pro",
          category: "accessories",
          description: "Noise-canceling wireless earbuds with spatial audio and MagSafe case.",
          price: 249.99,
          img: "img/airpodspro.jpg",
        },
        {
          id: 5,
          name: "Wireless Charger Pad",
          category: "accessories",
          description: "Fast and efficient Qi-certified wireless charger pad for all devices.",
          price: 39.99,
          img: "img/chargerpad.jpg",
        },
        {
          id: 6,
          name: "Phone Case - Galaxy S24",
          category: "accessories",
          description: "Durable and slim protective case for your Galaxy S24.",
          price: 19.99,
          img: "img/galaxycase.jpg",
        },
      ];

      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      const productId = parseInt(getQueryParam("id"));
      const product = products.find((p) => p.id === productId);

      const productDetailsEl = document.getElementById("product-details");

      if (product) {
        productDetailsEl.innerHTML = `
        <img class="product-image" src="${product.img}" alt="${product.name}" />
        <div class="product-info">
          <h2>${product.name}</h2>
          <p class="description">${product.description}</p>
          <p class="price">$${product.price.toFixed(2)}</p>
          <button class="btn">Add to Cart</button>
        </div>
      `;
      } else {
        productDetailsEl.innerHTML = "<p>Sorry, product not found.</p>";
      }
    </script>
  </body>
</html>
