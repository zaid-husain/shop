<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobiNest - Contact</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <div class="logo">MobiNest</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>

    <main class="container">
      <h1>Contact Us</h1>
      <p>
        Have questions about smartphones, accessories, or your order? Get in touch below and we’ll
        respond shortly.
      </p>

      <form class="contact-form" id="contact-form">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required aria-required="true" />

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required aria-required="true" />

        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </main>

    <div style="text-align: center; margin: 2rem 0">
      <button class="btn" onclick="history.back()">← Go Back</button>
    </div>

    <footer>&copy; 2025 MobiNest. All rights reserved.</footer>

    <script>
      document.getElementById("contact-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const name = this.name.value.trim();
        const email = this.email.value.trim();
        const message = this.message.value.trim();

        if (!name || !email || !message) {
          alert("Please fill out all required fields.");
          return;
        }

        alert(`Thank you, ${name}! Your message has been sent.`);

        this.reset();
      });
    </script>
  </body>
</html>
