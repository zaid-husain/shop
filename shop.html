<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MobiNest - Shop</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-papNM3aHtNULcED0pFQ7w3Vk5U5zLGk4zz1s+LEfuFY5R/jqRraW5Fa9OjYl3fqF9FflbAA9Xc0jC7XQ8CE3Wg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <div class="logo">MobiNest</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" aria-current="page">Shop</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main class="container">
      <h1>Shop the Latest Phones & Accessories</h1>

      <!-- Search bar -->
      <div style="margin-bottom: 1rem">
        <input
          type="search"
          id="shop-search"
          placeholder="Search products..."
          style="
            width: 100%;
            max-width: 400px;
            padding: 0.7rem 1rem;
            border-radius: 30px;
            border: none;
            font-size: 1rem;
          "
          aria-label="Search products"
        />
      </div>

      <div class="shop-filters">
        <label for="category-select">Filter by category:</label>
        <select id="category-select" aria-label="Filter products by category">
          <option value="all">All</option>
          <option value="ape-parts">Ape</option>
          <option value="alpha">Alpha</option>
          <option value="ape-city">Ape City</option>
        </select>
      </div>

      <div id="products" class="featured-products">
        <!-- Products will be rendered here by JS -->
      </div>
    </main>

    <div style="text-align: center; margin: 2rem 0">
      <button class="btn" onclick="history.back()">← Go Back</button>
    </div>

    <footer>&copy; 2025 MobiNest. All rights reserved.</footer>

    <script>

        {

          img: "img/rear_view_mirror.jpg",
        },
        {

        {

          price: 38.25,
          img: "img/exhaust_silencer.jpg",
        },
        {
          id: 15,
          name: "Spark Plug",
          category: "ape-parts",
          description: "Reliable spark plug for efficient combustion.",
          price: 4.5,
          img: "img/spark_plug.jpg",
        },
        {
          id: 16,
          name: "Alpha Side Mirror",
          category: "alpha",
          description: "Durable side mirror for Alpha series.",
          price: 11.99,
          img: "img/alpha_mirror.jpg",
        },
        {
          id: 17,
          name: "Ape City Headlight",
          category: "ape-city",
          description: "Headlight designed for Ape City models.",
          price: 19.99,
          img: "img/ape_city_headlight.jpg",
        },
      ];

      const productsContainer = document.getElementById("products");
      const categorySelect = document.getElementById("category-select");
      const shopSearch = document.getElementById("shop-search");

      function displayProducts(filterCategory = "all", filterSearch = "") {
        productsContainer.innerHTML = "";
        let filteredProducts = products;

        if (filterCategory !== "all") {
          filteredProducts = filteredProducts.filter((p) => p.category === filterCategory);
        }

        if (filterSearch.trim() !== "") {
          filteredProducts = filteredProducts.filter((p) =>
            p.name.toLowerCase().includes(filterSearch.toLowerCase()),
          );
        }

        if (filteredProducts.length === 0) {
          productsContainer.innerHTML = "<p>No products found matching your criteria.</p>";
          return;
        }

        filteredProducts.forEach((product) => {
          const productEl = document.createElement("div");
          productEl.className = "product-card";
          productEl.innerHTML = `
          <img src="${product.img}" alt="${product.name}" />
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <p><strong>$${product.price.toFixed(2)}</strong></p>
          <a href="product.html?id=${product.id}" class="btn">View Details</a>
        `;
          productsContainer.appendChild(productEl);
        });
      }

      categorySelect.addEventListener("change", () => {
        displayProducts(categorySelect.value, shopSearch.value);
      });

      shopSearch.addEventListener("input", () => {
        displayProducts(categorySelect.value, shopSearch.value);
      });

      // Initial load
      displayProducts();
    </script>
  </body>
</html>
